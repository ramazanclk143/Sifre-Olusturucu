<!DOCTYPE html>
<html>
<head>
    <title>Admin Paneli</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #e9edf5; /* Daha yumuşak bir arka plan */
            color: #222; /* Genel yazı rengi */
        }
    
       
    
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            background-color: #ffffff; /* Tablonun arka planı beyaz */
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }
    
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            color: #333; /* Hücrelerde yazı rengi */
            background-color: #fff; /* Hücre arka planı */
        }
    
        th {
            background-color: #1c3d7c;
            color: white;
        }
    
        tr:nth-child(even) td {
            background-color: #f5f7fb;
        }
    
        button {
            background-color: #17469c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    
        button:hover {
            background-color:rgb(10, 36, 94);
        }
    
        
    </style>
    
</head>
<body>
    <h1>Admin Paneli</h1>

    <h2>Kayıtlı Kullanıcılar</h2>
    <table>
        <tr>
            <th>Kullanıcı Adı</th>
            <th>E-posta</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
        </tr>
        {% endfor %}
    </table>

    <h2>Tüm Şifreler</h2>
    <table>
        <tr>
            <th>Kullanıcı Adı</th>
            <th>Şifre</th>
            <th>Güç</th>
        </tr>
        {% for p in passwords %}
        <tr>
            <td>{{ p.username }}</td>
            <td>{{ p.password }}</td>
            <td>{{ p.strength }}</td>
        </tr>
        {% endfor %}
    </table>

    <form action="{{ url_for('home') }}">
        <button type="submit">Ana Sayfa</button>
    </form>

    <a href="{{ url_for('logout_admin') }}">Çıkış Yap</a>
</body>
</html>
