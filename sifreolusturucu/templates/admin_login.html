<!DOCTYPE html>
<html>
<head>
    <title>Admin Girişi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

    <a href="{{ url_for('index') }}">

    </a>
    <form action="{{ url_for('home') }}">
        <button type="submit" style="background-color:rgb(23, 70, 156);">Home</button>
    </form>
   
</body>
</html>
